schema_version: 2
protocol_id: surv-vau-paper-comparison-v1

shared_evaluation:
  test_sources: frozen_source_isolated_test_split
  frames: 25
  frame_sampling: uniform
  resolution: [224, 224]
  temporal_unit: seconds
  decoding: greedy
  max_new_tokens: 384
  scorer: scripts/score_predictions.py
  required_prediction_fields: [video_id, raw_output]

reported_surv_vau_systems:
  - {name: Video-ChatGPT, parameters: 7B, comparison: external_descriptive}
  - {name: Video-LLaMA, parameters: 7B, comparison: external_descriptive}
  - {name: Video-LLaVA, parameters: 7B, comparison: external_descriptive}
  - {name: InternVL, parameters: 8B, comparison: external_descriptive}
  - {name: Holmes-VAU, parameters: 7B, comparison: external_descriptive}
  - {name: VideoLlama3, parameters: 7B, comparison: external_descriptive}
  - {name: Qwen3-VL, parameters: 8B, comparison: external_descriptive}
  - {name: LLaVA-NeXT-Video, parameters: 7B, comparison: external_descriptive}
  - {name: Qwen2.5-VL-3B, parameters: 3B, comparison: same_backbone_base}
  - {name: Qwen2.5-VL-3B-SFT, parameters: 3B, comparison: stage_1_checkpoint}
  - {name: Conan-R1, parameters: 3B, comparison: complete_two_stage_pipeline}

interpretation:
  external_models: descriptive_due_to_different_pretraining_and_adaptation
  sft_vs_conan_r1: descriptive_due_to_additional_stage_2_data_exposure
  severity_table: synthetic_seen_robustness_only
  natural_domain: separately_grouped_and_never_inferred_from_synthetic_scores
  synthetic_unseen_domain: separately_grouped_and_never_inferred_from_seen_scores
