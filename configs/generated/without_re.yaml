model:
  base_model: Qwen/Qwen2.5-VL-3B-Instruct
  sft_checkpoint: checkpoints/sft30
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
training:
  lr: 1.0e-05
  weight_decay: 0.0
  epochs: 5
  group_size: 4
  update_epochs: 2
  clip_eps: 0.2
  kl_coef: 0.02
  logging_steps: 10
  save_steps: 200
  max_grad_norm: 1.0
  seed: 42
  temperature: 0.9
  top_p: 0.95
reward:
  w_d: 0.3333333333
  w_e: 0.0
  w_t: 0.3333333333
  w_l: 0.3333333334
  lambda_s: 0.5
  lambda_fp: 0.3
  lambda_fn: 0.3
  length_tolerance: 0.2
  fixed_reasoning_target_length: null
ablation:
  allow_missing_type_influence: false
data:
  data_dir: data/surv_vau
  split: rl_train
  num_frames: 25
  frame_size: 224
  max_new_tokens: 384
output:
  checkpoint_dir: checkpoints/grpo_without_re
  log_file: training_log.jsonl
