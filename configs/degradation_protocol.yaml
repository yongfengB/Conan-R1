schema_version: 1
protocol_id: surv-vau-degradation-v1
seed: 42

# The clean reference is stored separately.  For each non-clean synthetic
# profile, K is sampled first and operators are then sampled without replacement.
severity_levels: [0.2, 0.4, 0.8]
factor_count_distribution:
  1: 0.60
  2: 0.30
  3: 0.10
combination_distribution:
  single_operator: 0.60
  cross_category_pair: 0.30
  one_per_seen_category: 0.10
severity_assignment: all_active_operators_use_profile_level
operator_order:
  - vehicle_mask
  - interaction_area_mask
  - motion_blur
  - defocus_blur
  - low_light
  - tunnel_low_light
  - fog
  - rain_snow
  - lens_flare
  - sensor_noise
  - compression_artifact

seen_training_operators:
  local_occlusion: [vehicle_mask, interaction_area_mask]
  evidence_quality: [motion_blur, lens_flare, sensor_noise]
  environmental: [low_light, rain_snow, fog, tunnel_low_light]

# These two operators and all combinations containing them are test-only.
synthetic_unseen_test_operators: [defocus_blur, compression_artifact]
synthetic_unseen_test_combinations:
  - [vehicle_mask, interaction_area_mask]
  - [motion_blur, lens_flare]
  - [rain_snow, fog, tunnel_low_light]
synthetic_unseen_mode_distribution:
  held_out_operator: 0.50
  held_out_combination: 0.50
natural_test_rule: source_observation_only

operators:
  vehicle_mask:
    target: event_relevant_vehicle_trajectory
    maximum_magnitude: {target_area_coverage: 1.0, opacity: 0.95}
    temporal_model: linearly_interpolated_track_boxes
  interaction_area_mask:
    target: annotated_interaction_region_or_closest_event_track_pair
    maximum_magnitude: {target_area_coverage: 1.0, opacity: 0.95}
    temporal_model: linearly_interpolated_region_or_track_union
  motion_blur:
    maximum_magnitude: {kernel_length_px: 31, direction_drift_deg: 5.0}
    temporal_model: dominant_track_motion_with_smooth_direction_drift
  lens_flare:
    maximum_magnitude: {radius_fraction_of_short_side: 0.40, opacity: 0.65}
    temporal_model: video_level_origin_velocity_and_sinusoidal_drift
  sensor_noise:
    maximum_magnitude: {sigma_8bit_levels: 50.0}
    temporal_model: {type: ar1, rho: 0.85}
  low_light:
    maximum_magnitude: {intensity_reduction: 0.80}
    temporal_model: video_constant
  tunnel_low_light:
    maximum_magnitude: {intensity_reduction: 0.80}
    temporal_model: video_constant
  rain_snow:
    maximum_magnitude: {particles_per_frame: 300}
    temporal_model: persistent_particles_with_video_level_advection
  fog:
    maximum_magnitude: {veil_opacity: 0.70, veil_value_8bit: 220}
    temporal_model: video_constant
  defocus_blur:
    split: synthetic_unseen_test_only
    maximum_magnitude: {gaussian_sigma_px: 4.0}
    temporal_model: video_constant
  compression_artifact:
    split: synthetic_unseen_test_only
    maximum_magnitude: {jpeg_quality_floor: 20}
    temporal_model: fixed_quality_per_video

domain_contract:
  clean:
    synthesis_applied: false
    description: original source clip without an added operator
  synthetic_seen:
    synthesis_applied: true
    description: operators sampled from seen_training_operators
  synthetic_unseen:
    synthesis_applied: true
    description: test-only operator or held-out combination
  natural:
    synthesis_applied: false
    description: naturally degraded source footage; no synthetic operator is applied
