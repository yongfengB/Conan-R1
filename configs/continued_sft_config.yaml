model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  init_checkpoint: "checkpoints/sft30"
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05

training:
  lr: 1.0e-5
  batch_size: 1
  gradient_accumulation_steps: 4
  epochs: 5
  warmup_steps: 0
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_steps: 500
  logging_steps: 50
  seed: 42
  enabled_blocks: ["TYPE", "INFLUENCE", "REASONING", "CONCLUSION", "ANSWER"]

data:
  data_dir: "data/surv_vau"
  splits: ["rl_train"]
  num_frames: 25
  frame_size: 224
  max_new_tokens: 384

output:
  checkpoint_dir: "checkpoints/continued_sft70"
